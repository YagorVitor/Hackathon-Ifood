<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Aplica somente preferências visuais antes da primeira pintura.
      try {
        const value = JSON.parse(localStorage.getItem('despensa-reversa.accessibility.v1') || '{}');
        const root = document.documentElement;
        root.dataset.theme = value.theme === 'dark' || (value.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        root.dataset.textSize = ['large', 'extra'].includes(value.textSize) ? value.textSize : 'normal';
        root.dataset.contrast = value.highContrast === true ? 'high' : 'normal';
        root.dataset.motion = value.reduceMotion === true ? 'reduce' : 'system';
        root.lang = value.language === 'en' ? 'en' : 'pt-BR';
      } catch { /* As preferências padrão continuam disponíveis. */ }
    </script>
    <meta name="theme-color" content="#ea1d2c" />
    <meta name="description" content="CompletAI: conte o que você tem em casa, planeje a refeição e compre só o que faltar." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Sem rede, a interface cai nas fontes do sistema. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750;800&display=swap"
    />
    <title>CompletAI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
